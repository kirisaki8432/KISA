plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Patch 4.2: satu keystore release TETAP (bukan debug keystore yang dibuat
// tiap runner GitHub baru) supaya APK 4.2+ bisa update menimpa versi lama.
// Kredensial dibaca dari environment — di CI diisi dari GitHub secrets
// (KISA_KEYSTORE_PATH, KISA_KEYSTORE_PASSWORD, KISA_KEY_ALIAS,
// KISA_KEY_PASSWORD; lihat .github/workflows/build-apps.yml). Tanpa env
// (build lokal), build release memakai signing debug supaya tetap jalan.
// Catatan: password key == password store (wajib untuk PKCS#12 openssl).
def kisaKeystorePath = System.getenv("KISA_KEYSTORE_PATH")
def kisaKeystorePassword = System.getenv("KISA_KEYSTORE_PASSWORD")
def kisaKeyAlias = System.getenv("KISA_KEY_ALIAS")
def kisaKeyPassword = System.getenv("KISA_KEY_PASSWORD")
def hasReleaseKeystore = kisaKeystorePath?.trim() && kisaKeystorePassword?.trim() &&
    kisaKeyAlias?.trim() && kisaKeyPassword?.trim() && file(kisaKeystorePath).exists()

android {
    namespace 'com.kirisaki.kisa'
    compileSdk 34

    defaultConfig {
        applicationId "com.kirisaki.kisa"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "4.3"
    }

    signingConfigs {
        release {
            storeFile file(kisaKeystorePath ?: "kisa-release.p12")
            storePassword kisaKeystorePassword
            keyAlias kisaKeyAlias
            keyPassword kisaKeyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
}
