# Build KISA Apps — .exe Windows + .apk Android (S138 Cara 3)
#
# Berjalan saat tag v* di-push (mis. v4.0) atau dijalankan manual.
# Hasil: KISA.exe + KISA-Setup-4.0.exe (Windows) dan KISA-4.0.apk (Android)
# di tab Artifacts setiap job.
#
# Catatan jujur:
# - Job Windows WAJIB windows-latest: PyInstaller Linux tidak bisa membuat
#   .exe Windows, dan Inno Setup hanya jalan di Windows.
# - Job Android memakai setup-android + Gradle; APK yang dihasilkan adalah
#   wrapper WebView (app/android) yang membuka server LAN PC — BUKAN TWA
#   (TWA butuh PWA di URL HTTPS publik, lihat app/twa/README.md).

name: Build KISA Apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    name: "Windows: KISA.exe + Installer"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r app/requirements-app.txt

      - name: Build KISA.exe (PyInstaller)
        run: pyinstaller app/KISA.spec

      - name: Cek hasil exe
        run: |
          if (-not (Test-Path "dist/KISA.exe")) { throw "dist/KISA.exe tidak ditemukan" }
          Get-Item "dist/KISA.exe" | Select-Object Length

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" app\KISA-Setup.iss
          if (-not (Test-Path "dist-installer/KISA-Setup-4.0.exe")) { throw "Installer tidak ditemukan" }

      - name: Upload KISA.exe
        uses: actions/upload-artifact@v4
        with:
          name: KISA-exe-4.0
          path: dist/KISA.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KISA-Setup-4.0
          path: dist-installer/KISA-Setup-4.0.exe

  build-android:
    name: "Android: KISA.apk (WebView)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          echo "y" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"


      - name: Build APK (Gradle)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.7"
          arguments: assembleDebug
          build-root-directory: app/android

      - name: Cek hasil apk
        run: |
          ls -la app/android/app/build/outputs/apk/debug/
          test -f app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK (KISA-4.0.apk)
        run: |
          mv app/android/app/build/outputs/apk/debug/app-debug.apk app/android/app/build/outputs/apk/debug/KISA-4.0.apk
          ls -la app/android/app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KISA-apk-4.0
          path: app/android/app/build/outputs/apk/debug/KISA-4.0.apk
